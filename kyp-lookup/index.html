<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Policy & Case Lookup</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --panel-2: #1d212b;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #4fd1a5;
    --accent-dim: #2d6b56;
    --warn: #e8a23d;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.2px;
  }
  .header .meta {
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
  }
  .tabs {
    display: flex;
    gap: 2px;
    padding: 12px 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 18px;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
  }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .container { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .search-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .search-box {
    flex: 1;
    min-width: 260px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 11px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .search-box input:focus {
    border-color: var(--accent-dim);
  }
  select {
    padding: 11px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    min-width: 140px;
  }
  .stat-bar {
    display: flex;
    gap: 20px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    flex-wrap: wrap;
  }
  .stat-bar b { color: var(--accent); font-weight: 600; }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .corp-name {
    font-weight: 600;
    font-size: 14.5px;
    color: var(--text);
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    background: var(--accent-dim);
    color: var(--accent);
    font-family: var(--mono);
  }
  .badge.year { background: #2a2f3a; color: var(--text-dim); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px 16px;
  }
  .field {
    font-size: 12.5px;
  }
  .field .label {
    color: var(--text-dim);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }
  .field .val {
    color: var(--text);
    font-family: var(--mono);
    word-break: break-word;
  }
  .field .val.empty { color: #4a4f5a; }
  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .pagination button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .pagination button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .hint {
    color: var(--text-dim);
    font-size: 12px;
    margin-top: -6px;
    margin-bottom: 14px;
  }
  .loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  ::placeholder { color: #5a6070; }
</style>
</head>
<body>

<div class="header">
  <h1>Corporate Policy &amp; Case Lookup</h1>
  <div class="meta" id="headerMeta">loading data&hellip;</div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="policy">Policy Rules (KYP)</button>
  <button class="tab" data-tab="case">Case &amp; Treatment</button>
</div>

<div class="container">

  <div id="policyTab">
    <div class="search-row">
      <div class="search-box">
        <input type="text" id="policySearch" placeholder="Search corporate, insurer, or TPA name (fuzzy match \u2014 handles typos)">
      </div>
      <select id="policyYear"><option value="">All years</option></select>
      <select id="policyInsurer"><option value="">All insurers</option></select>
    </div>
    <div class="hint">Fuzzy search tolerates typos/variants (e.g. "aditya birla" matches "ADITYA BIRLKA"). 68,837 policy records.</div>
    <div class="stat-bar" id="policyStats"></div>
    <div class="results" id="policyResults"></div>
    <div class="pagination" id="policyPagination"></div>
  </div>

  <div id="caseTab" style="display:none;">
    <div class="search-row">
      <div class="search-box">
        <input type="text" id="caseSearch" placeholder="Search corporate, insurer, TPA, or treatment category">
      </div>
      <select id="caseYear"><option value="">All years</option></select>
      <select id="caseCategory"><option value="">All categories</option></select>
    </div>
    <div class="hint">8,069 case records with treatment category and policy terms.</div>
    <div class="stat-bar" id="caseStats"></div>
    <div class="results" id="caseResults"></div>
    <div class="pagination" id="casePagination"></div>
  </div>

</div>

<script>
const PAGE_SIZE = 25;
let policyData = null, caseData = null;
let policyFuse = null, caseFuse = null;
let policyState = { page: 1, filtered: [] };
let caseState = { page: 1, filtered: [] };

async function loadData() {
  const [pRes, cRes] = await Promise.all([
    fetch('policy_data.json?v=' + Date.now()),
    fetch('case_data.json?v=' + Date.now())
  ]);
  policyData = await pRes.json();
  caseData = await cRes.json();

  document.getElementById('headerMeta').textContent =
    `${policyData.rows.length.toLocaleString()} policy records \u00b7 ${caseData.rows.length.toLocaleString()} case records`;

  buildPolicyFuse();
  buildCaseFuse();
  populateFilters();
  renderPolicy();
  renderCase();
}

function buildPolicyFuse() {
  // Build searchable corpus: one entry per unique corp/ins/tpa combo string for speed,
  // but we search per-row using the dict-decoded corp/ins/tpa fields.
  const searchRows = policyData.rows.map((r, i) => ({
    idx: i,
    corp: policyData.dicts.corp[r[0]],
    ins: policyData.dicts.ins[r[1]],
    tpa: policyData.dicts.tpa[r[2]]
  }));
  policyFuse = new Fuse(searchRows, {
    keys: ['corp', 'ins', 'tpa'],
    threshold: 0.35,
    ignoreLocation: true,
    minMatchCharLength: 2
  });
  policyState.searchRows = searchRows;
}

function buildCaseFuse() {
  const searchRows = caseData.rows.map((r, i) => ({
    idx: i,
    corp: caseData.dicts.corp[r[0]],
    ins: caseData.dicts.ins[r[1]],
    tpa: caseData.dicts.tpa[r[2]],
    cat: caseData.dicts.cat[r[12]],
    treat: caseData.dicts.treat[r[11]]
  }));
  caseFuse = new Fuse(searchRows, {
    keys: ['corp', 'ins', 'tpa', 'cat', 'treat'],
    threshold: 0.35,
    ignoreLocation: true,
    minMatchCharLength: 2
  });
  caseState.searchRows = searchRows;
}

function populateFilters() {
  // Policy years
  const years = [...new Set(policyData.rows.map(r => r[12]).filter(y => y))].sort((a,b) => b-a);
  const yearSel = document.getElementById('policyYear');
  years.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  });
  const noDateOpt = document.createElement('option');
  noDateOpt.value = 'none'; noDateOpt.textContent = 'No date on record';
  yearSel.appendChild(noDateOpt);

  // Policy insurers (top ones by frequency, normalized uppercase for the dropdown only)
  const insCounts = {};
  policyData.rows.forEach(r => {
    const ins = policyData.dicts.ins[r[1]];
    if (ins) {
      const key = ins.toUpperCase();
      insCounts[key] = (insCounts[key] || 0) + 1;
    }
  });
  const topIns = Object.entries(insCounts).sort((a,b) => b[1]-a[1]).slice(0, 40);
  const insSel = document.getElementById('policyInsurer');
  topIns.forEach(([name, count]) => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = `${name} (${count})`;
    insSel.appendChild(opt);
  });

  // Case years
  const cYears = [...new Set(caseData.rows.map(r => r[14]).filter(y => y))].sort((a,b) => b-a);
  const cYearSel = document.getElementById('caseYear');
  cYears.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    cYearSel.appendChild(opt);
  });

  // Case categories
  const cats = [...new Set(caseData.dicts.cat.filter(c => c))].sort();
  const catSel = document.getElementById('caseCategory');
  cats.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    catSel.appendChild(opt);
  });
}

function fieldHtml(label, val) {
  const display = (val === null || val === undefined || val === '') ? '\u2014' : val;
  const cls = display === '\u2014' ? 'val empty' : 'val';
  return `<div class="field"><div class="label">${label}</div><div class="${cls}">${escapeHtml(String(display))}</div></div>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getPolicyFiltered() {
  const q = document.getElementById('policySearch').value.trim();
  const yearFilter = document.getElementById('policyYear').value;
  const insFilter = document.getElementById('policyInsurer').value;

  let indices;
  if (q.length >= 2) {
    indices = policyFuse.search(q).map(r => r.item.idx);
  } else {
    indices = policyData.rows.map((_, i) => i);
  }

  if (yearFilter) {
    indices = indices.filter(i => {
      const y = policyData.rows[i][12];
      if (yearFilter === 'none') return !y;
      return y === parseInt(yearFilter);
    });
  }
  if (insFilter) {
    indices = indices.filter(i => {
      const ins = policyData.dicts.ins[policyData.rows[i][1]];
      return ins && ins.toUpperCase() === insFilter;
    });
  }
  return indices;
}

function getCaseFiltered() {
  const q = document.getElementById('caseSearch').value.trim();
  const yearFilter = document.getElementById('caseYear').value;
  const catFilter = document.getElementById('caseCategory').value;

  let indices;
  if (q.length >= 2) {
    indices = caseFuse.search(q).map(r => r.item.idx);
  } else {
    indices = caseData.rows.map((_, i) => i);
  }

  if (yearFilter) {
    indices = indices.filter(i => caseData.rows[i][14] === parseInt(yearFilter));
  }
  if (catFilter) {
    indices = indices.filter(i => caseData.dicts.cat[caseData.rows[i][12]] === catFilter);
  }
  return indices;
}

function renderPolicy() {
  const indices = getPolicyFiltered();
  policyState.filtered = indices;
  policyState.page = 1;
  document.getElementById('policyStats').innerHTML =
    `Matches: <b>${indices.length.toLocaleString()}</b> &nbsp;|&nbsp; of ${policyData.rows.length.toLocaleString()} total`;
  renderPolicyPage();
}

function renderPolicyPage() {
  const { filtered, page } = policyState;
  const start = (page - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('policyResults');

  if (pageItems.length === 0) {
    container.innerHTML = `<div class="no-results">No matching records. Try a broader search term.</div>`;
    document.getElementById('policyPagination').innerHTML = '';
    return;
  }

  container.innerHTML = pageItems.map(i => {
    const r = policyData.rows[i];
    const d = policyData.dicts;
    const yearBadge = r[12] ? `<span class="badge year">${r[12]}</span>` : `<span class="badge year">No date</span>`;
    return `
      <div class="card">
        <div class="card-top">
          <div class="corp-name">${escapeHtml(d.corp[r[0]] || 'Unknown corporate')}</div>
          <div>${yearBadge} <span class="badge">${escapeHtml(d.ins[r[1]] || 'Unknown insurer')}</span></div>
        </div>
        <div class="grid">
          ${fieldHtml('TPA', d.tpa[r[2]])}
          ${fieldHtml('Relation', d.rel[r[3]])}
          ${fieldHtml('Sum Insured', d.si[r[4]])}
          ${fieldHtml('Room Rent', d.rr[r[5]])}
          ${fieldHtml('Waiting Period', d.wp[r[6]])}
          ${fieldHtml('Disease', d.dis[r[7]])}
          ${fieldHtml('Co-Payment', d.cop[r[8]])}
          ${fieldHtml('PED Covered', d.ped[r[9]])}
          ${fieldHtml('Policy Start', r[10])}
          ${fieldHtml('Expiry', r[11])}
        </div>
      </div>`;
  }).join('');

  renderPagination('policyPagination', policyState, renderPolicyPage);
}

function renderCase() {
  const indices = getCaseFiltered();
  caseState.filtered = indices;
  caseState.page = 1;
  document.getElementById('caseStats').innerHTML =
    `Matches: <b>${indices.length.toLocaleString()}</b> &nbsp;|&nbsp; of ${caseData.rows.length.toLocaleString()} total`;
  renderCasePage();
}

function renderCasePage() {
  const { filtered, page } = caseState;
  const start = (page - 1) * PAGE_SIZE;
  const pageItems = filtered.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('caseResults');

  if (pageItems.length === 0) {
    container.innerHTML = `<div class="no-results">No matching records. Try a broader search term.</div>`;
    document.getElementById('casePagination').innerHTML = '';
    return;
  }

  container.innerHTML = pageItems.map(i => {
    const r = caseData.rows[i];
    const d = caseData.dicts;
    const yearBadge = r[14] ? `<span class="badge year">${r[14]}</span>` : `<span class="badge year">No date</span>`;
    return `
      <div class="card">
        <div class="card-top">
          <div class="corp-name">${escapeHtml(d.corp[r[0]] || 'Unknown corporate')}</div>
          <div>${yearBadge} <span class="badge">${escapeHtml(d.ins[r[1]] || 'Unknown insurer')}</span></div>
        </div>
        <div class="grid">
          ${fieldHtml('TPA', d.tpa[r[2]])}
          ${fieldHtml('Policy Type', d.ptype[r[3]])}
          ${fieldHtml('Gipsa', d.gipsa[r[4]])}
          ${fieldHtml('Sum Insured', d.si[r[5]])}
          ${fieldHtml('Balance SI', d.bsi[r[6]])}
          ${fieldHtml('Co-Pay', d.cop[r[7]])}
          ${fieldHtml('Disease Capping', d.dis[r[8]])}
          ${fieldHtml('Room', d.room[r[9]])}
          ${fieldHtml('Coverage', d.cov[r[10]])}
          ${fieldHtml('Treatment', d.treat[r[11]])}
          ${fieldHtml('Category', d.cat[r[12]])}
          ${fieldHtml('Policy Date', r[13])}
        </div>
      </div>`;
  }).join('');

  renderPagination('casePagination', caseState, renderCasePage);
}

function renderPagination(elId, state, renderFn) {
  const totalPages = Math.ceil(state.filtered.length / PAGE_SIZE);
  const el = document.getElementById(elId);
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button ${state.page <= 1 ? 'disabled' : ''} id="${elId}-prev">Prev</button>
    <span>Page ${state.page} of ${totalPages}</span>
    <button ${state.page >= totalPages ? 'disabled' : ''} id="${elId}-next">Next</button>
  `;
  document.getElementById(`${elId}-prev`)?.addEventListener('click', () => {
    state.page--; renderFn();
    document.getElementById(elId.replace('Pagination','Results')).scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById(`${elId}-next`)?.addEventListener('click', () => {
    state.page++; renderFn();
    document.getElementById(elId.replace('Pagination','Results')).scrollIntoView({behavior:'smooth', block:'start'});
  });
}

// Debounce helper
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const target = tab.dataset.tab;
      document.getElementById('policyTab').style.display = target === 'policy' ? 'block' : 'none';
      document.getElementById('caseTab').style.display = target === 'case' ? 'block' : 'none';
    });
  });

  document.getElementById('policySearch').addEventListener('input', debounce(renderPolicy, 200));
  document.getElementById('policyYear').addEventListener('change', renderPolicy);
  document.getElementById('policyInsurer').addEventListener('change', renderPolicy);

  document.getElementById('caseSearch').addEventListener('input', debounce(renderCase, 200));
  document.getElementById('caseYear').addEventListener('change', renderCase);
  document.getElementById('caseCategory').addEventListener('change', renderCase);

  loadData();
});
</script>

</body>
</html>
