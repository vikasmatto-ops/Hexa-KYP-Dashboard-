<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporate Policy & Case Lookup</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161920;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --text-dim: #8b93a3;
    --accent: #4fd1a5;
    --accent-dim: #2d6b56;
    --policy-color: #6ea8fe;
    --policy-dim: #23324f;
    --case-color: #e8a23d;
    --case-dim: #4a3a1f;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
  }
  .header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.2px;
  }
  .header .meta {
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
  }
  .container { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }
  .search-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .search-box {
    flex: 1;
    min-width: 260px;
  }
  .search-box input {
    width: 100%;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent-dim); }
  select {
    padding: 11px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    min-width: 130px;
  }
  .type-filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .type-chip {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .type-chip.active-policy { border-color: var(--policy-color); color: var(--policy-color); background: var(--policy-dim); }
  .type-chip.active-case { border-color: var(--case-color); color: var(--case-color); background: var(--case-dim); }
  .type-chip.active-all { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .stat-bar {
    display: flex;
    gap: 20px;
    padding: 10px 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
    flex-wrap: wrap;
  }
  .stat-bar b { color: var(--accent); font-weight: 600; }
  .results { display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    border-left: 3px solid var(--border);
  }
  .card.policy { border-left-color: var(--policy-color); }
  .card.case { border-left-color: var(--case-color); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .corp-name { font-weight: 600; font-size: 14.5px; color: var(--text); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    font-family: var(--mono);
  }
  .badge.type-policy { background: var(--policy-dim); color: var(--policy-color); }
  .badge.type-case { background: var(--case-dim); color: var(--case-color); }
  .badge.ins { background: var(--accent-dim); color: var(--accent); }
  .badge.year { background: #2a2f3a; color: var(--text-dim); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 8px 16px;
  }
  .field { font-size: 12.5px; }
  .field .label {
    color: var(--text-dim);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 2px;
  }
  .field .val { color: var(--text); font-family: var(--mono); word-break: break-word; }
  .field .val.empty { color: #4a4f5a; }
  .no-results { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .group-card { border-left: 3px solid var(--accent); }
  .group-header:hover .corp-name { color: var(--accent); }
  .group-card .hint { margin: 4px 0 0 0 !important; }
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-top: 20px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .pagination button {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
  }
  .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: -6px; margin-bottom: 14px; }
  ::placeholder { color: #5a6070; }
</style>
</head>
<body>

<div class="header">
  <h1>Corporate Policy &amp; Case Lookup</h1>
  <div class="meta" id="headerMeta">loading data&hellip;</div>
</div>

<div class="container">

  <div class="search-row">
    <div class="search-box">
      <input type="text" id="search" autocomplete="off" placeholder="Search corporate, insurer, TPA, or category (fuzzy match — handles typos)">
    </div>
    <select id="yearFilter"><option value="">All years</option></select>
  </div>

  <div class="type-filters">
    <div class="type-chip active-all" data-type="all" id="chipAll">All results</div>
    <div class="type-chip" data-type="policy" id="chipPolicy">Policy (KYP)</div>
    <div class="type-chip" data-type="case" id="chipCase">Case &amp; Treatment</div>
  </div>

  <div class="hint">Fuzzy search tolerates typos/variants. Each result is tagged Policy or Case so you know its source.</div>
  <div class="stat-bar" id="stats"></div>
  <div class="results" id="results"></div>
  <div class="pagination" id="pagination"></div>

</div>

<script>
const PAGE_SIZE = 25;
let policyData = null, caseData = null;
let combinedFuse = null;
let combinedRows = [];
let state = { page: 1, filtered: [], typeFilter: 'all' };

async function loadData() {
  const [pRes, cRes] = await Promise.all([
    fetch('policy_data.json?v=' + Date.now()),
    fetch('case_data.json?v=' + Date.now())
  ]);
  policyData = await pRes.json();
  caseData = await cRes.json();

  document.getElementById('headerMeta').textContent =
    `${policyData.rows.length.toLocaleString()} policy records \u00b7 ${caseData.rows.length.toLocaleString()} case records`;

  buildCombined();
  populateFilters();
  render();
}

function normalizeCorp(name) {
  if (!name) return '';
  let n = name.toLowerCase().trim();
  n = n.replace(/[.,\-_/()]/g, ' ');
  n = n.replace(/\s+/g, ' ').trim();
  const suffixes = [' private limited', ' pvt ltd', ' ltd', ' limited', ' technologies', ' technology', ' pvt', ' llp', ' inc', ' co'];
  let changed = true;
  while (changed) {
    changed = false;
    for (const s of suffixes) {
      if (n.endsWith(s)) { n = n.slice(0, -s.length).trim(); changed = true; }
    }
  }
  return n;
}

function buildCombined() {
  combinedRows = [];

  policyData.rows.forEach((r, i) => {
    const corp = policyData.dicts.corp[r[0]] || '';
    combinedRows.push({
      type: 'policy',
      idx: i,
      corp: corp,
      normCorp: normalizeCorp(corp),
      ins: policyData.dicts.ins[r[1]] || '',
      tpa: policyData.dicts.tpa[r[2]] || '',
      cat: '',
      year: r[12] || 0,
      raw: r
    });
  });

  caseData.rows.forEach((r, i) => {
    const corp = caseData.dicts.corp[r[0]] || '';
    combinedRows.push({
      type: 'case',
      idx: i,
      corp: corp,
      normCorp: normalizeCorp(corp),
      ins: caseData.dicts.ins[r[1]] || '',
      tpa: caseData.dicts.tpa[r[2]] || '',
      cat: caseData.dicts.cat[r[12]] || '',
      year: r[14] || 0,
      raw: r
    });
  });

  combinedFuse = new Fuse(combinedRows, {
    keys: ['corp', 'ins', 'tpa', 'cat'],
    threshold: 0.35,
    ignoreLocation: true,
    minMatchCharLength: 2
  });
}

function groupByCorp(items) {
  const groups = new Map();
  const order = [];
  items.forEach(item => {
    const key = item.normCorp || ('__ungrouped__' + item.corp);
    if (!groups.has(key)) {
      groups.set(key, { key, displayName: item.corp, items: [] });
      order.push(key);
    }
    groups.get(key).items.push(item);
    // prefer the longest/most complete-looking name as display name
    if (item.corp.length > groups.get(key).displayName.length) {
      groups.get(key).displayName = item.corp;
    }
  });
  return order.map(k => groups.get(k));
}

function populateFilters() {
  const years = [...new Set(combinedRows.map(r => r.year).filter(y => y >= 2020 && y <= 2026))].sort((a,b) => b-a);
  const yearSel = document.getElementById('yearFilter');
  years.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y; opt.textContent = y;
    yearSel.appendChild(opt);
  });
  const noDateOpt = document.createElement('option');
  noDateOpt.value = 'none'; noDateOpt.textContent = 'No date on record';
  yearSel.appendChild(noDateOpt);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fieldHtml(label, val) {
  const display = (val === null || val === undefined || val === '') ? '\u2014' : val;
  const cls = display === '\u2014' ? 'val empty' : 'val';
  return `<div class="field"><div class="label">${label}</div><div class="${cls}">${escapeHtml(display)}</div></div>`;
}

function getFiltered() {
  const q = document.getElementById('search').value.trim();
  const yearFilter = document.getElementById('yearFilter').value;

  let items;
  if (q.length >= 2) {
    items = combinedFuse.search(q).map(r => r.item);
  } else {
    items = combinedRows;
  }

  if (state.typeFilter !== 'all') {
    items = items.filter(item => item.type === state.typeFilter);
  }

  if (yearFilter) {
    items = items.filter(item => {
      if (yearFilter === 'none') return !item.year;
      return item.year === parseInt(yearFilter);
    });
  }

  return items;
}

function renderRecordCard(item) {
  if (item.type === 'policy') {
    const r = item.raw, d = policyData.dicts;
    const yearBadge = r[12] ? `<span class="badge year">${r[12]}</span>` : `<span class="badge year">No date</span>`;
    return `
      <div class="card policy">
        <div class="card-top">
          <div class="corp-name">${escapeHtml(d.corp[r[0]] || 'Unknown corporate')}</div>
          <div>
            <span class="badge type-policy">POLICY</span>
            ${yearBadge}
            <span class="badge ins">${escapeHtml(d.ins[r[1]] || 'Unknown insurer')}</span>
          </div>
        </div>
        <div class="grid">
          ${fieldHtml('TPA', d.tpa[r[2]])}
          ${fieldHtml('Relation', d.rel[r[3]])}
          ${fieldHtml('Sum Insured', d.si[r[4]])}
          ${fieldHtml('Room Rent', d.rr[r[5]])}
          ${fieldHtml('Waiting Period', d.wp[r[6]])}
          ${fieldHtml('Disease', d.dis[r[7]])}
          ${fieldHtml('Co-Payment', d.cop[r[8]])}
          ${fieldHtml('PED Covered', d.ped[r[9]])}
          ${fieldHtml('Policy Start', r[10])}
          ${fieldHtml('Expiry', r[11])}
        </div>
      </div>`;
  } else {
    const r = item.raw, d = caseData.dicts;
    const yearBadge = r[14] ? `<span class="badge year">${r[14]}</span>` : `<span class="badge year">No date</span>`;
    return `
      <div class="card case">
        <div class="card-top">
          <div class="corp-name">${escapeHtml(d.corp[r[0]] || 'Unknown corporate')}</div>
          <div>
            <span class="badge type-case">CASE</span>
            ${yearBadge}
            <span class="badge ins">${escapeHtml(d.ins[r[1]] || 'Unknown insurer')}</span>
          </div>
        </div>
        <div class="grid">
          ${fieldHtml('TPA', d.tpa[r[2]])}
          ${fieldHtml('Policy Type', d.ptype[r[3]])}
          ${fieldHtml('Gipsa', d.gipsa[r[4]])}
          ${fieldHtml('Sum Insured', d.si[r[5]])}
          ${fieldHtml('Balance SI', d.bsi[r[6]])}
          ${fieldHtml('Co-Pay', d.cop[r[7]])}
          ${fieldHtml('Disease Capping', d.dis[r[8]])}
          ${fieldHtml('Room', d.room[r[9]])}
          ${fieldHtml('Coverage', d.cov[r[10]])}
          ${fieldHtml('Treatment', d.treat[r[11]])}
          ${fieldHtml('Category', d.cat[r[12]])}
          ${fieldHtml('Policy Date', r[13])}
        </div>
      </div>`;
  }
}

function render() {
  const items = getFiltered();
  const groups = groupByCorp(items);
  state.filtered = groups;
  state.page = 1;

  const policyCount = items.filter(i => i.type === 'policy').length;
  const caseCount = items.filter(i => i.type === 'case').length;

  document.getElementById('stats').innerHTML =
    `Matches: <b>${items.length.toLocaleString()}</b> &nbsp;|&nbsp; Corporates: <b>${groups.length.toLocaleString()}</b> &nbsp;|&nbsp; Policy: <b>${policyCount.toLocaleString()}</b> &nbsp;|&nbsp; Case: <b>${caseCount.toLocaleString()}</b>`;

  renderPage();
}

function renderPage() {
  const { filtered, page } = state;
  const start = (page - 1) * PAGE_SIZE;
  const pageGroups = filtered.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('results');

  if (pageGroups.length === 0) {
    container.innerHTML = `<div class="no-results">No matching records. Try a broader search term.</div>`;
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  container.innerHTML = pageGroups.map((group, gi) => {
    const groupId = `grp-${start + gi}`;
    const count = group.items.length;
    const variantCount = new Set(group.items.map(i => i.corp)).size;
    const policyN = group.items.filter(i => i.type === 'policy').length;
    const caseN = group.items.filter(i => i.type === 'case').length;

    if (count === 1) {
      // single record: just show the card directly, no grouping chrome needed
      return renderRecordCard(group.items[0]);
    }

    const variantNote = variantCount > 1
      ? `<span class="hint" style="margin:0;">${variantCount} name variants merged</span>`
      : '';

    return `
      <div class="card group-card">
        <div class="group-header" onclick="toggleGroup('${groupId}')" style="cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
          <div class="corp-name">${escapeHtml(group.displayName || 'Unknown corporate')}</div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${policyN ? `<span class="badge type-policy">${policyN} POLICY</span>` : ''}
            ${caseN ? `<span class="badge type-case">${caseN} CASE</span>` : ''}
            <span class="badge year" id="${groupId}-arrow">\u25be Show ${count} records</span>
          </div>
        </div>
        ${variantNote}
        <div class="group-body" id="${groupId}" style="display:none; margin-top:12px; flex-direction: column; gap: 8px;">
          ${group.items.map(renderRecordCard).join('')}
        </div>
      </div>`;
  }).join('');

  renderPagination();
}

function toggleGroup(groupId) {
  const body = document.getElementById(groupId);
  const arrow = document.getElementById(groupId + '-arrow');
  if (!body) return;
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'flex';
  if (arrow) {
    const count = body.querySelectorAll('.card').length;
    arrow.textContent = isOpen ? `\u25be Show ${count} records` : `\u25b4 Hide records`;
  }
}

function renderPagination() {
  const totalPages = Math.ceil(state.filtered.length / PAGE_SIZE);
  const el = document.getElementById('pagination');
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button ${state.page <= 1 ? 'disabled' : ''} id="prevBtn">Prev</button>
    <span>Page ${state.page} of ${totalPages}</span>
    <button ${state.page >= totalPages ? 'disabled' : ''} id="nextBtn">Next</button>
  `;
  document.getElementById('prevBtn')?.addEventListener('click', () => {
    state.page--; renderPage();
    document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('nextBtn')?.addEventListener('click', () => {
    state.page++; renderPage();
    document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});
  });
}

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search').addEventListener('input', debounce(render, 200));
  document.getElementById('yearFilter').addEventListener('change', render);

  document.querySelectorAll('.type-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      state.typeFilter = chip.dataset.type;
      document.querySelectorAll('.type-chip').forEach(c => {
        c.classList.remove('active-all', 'active-policy', 'active-case');
      });
      if (chip.dataset.type === 'all') chip.classList.add('active-all');
      if (chip.dataset.type === 'policy') chip.classList.add('active-policy');
      if (chip.dataset.type === 'case') chip.classList.add('active-case');
      render();
    });
  });

  loadData();
});
</script>

</body>
</html>
